name: Deploy Desarrollo

# Redespliegue manual / rollback del ambiente de desarrollo.
# El despliegue automático de develop vive ahora en ci.yml (job
# deploy-develop) porque workflow_run no se activa desde una rama que no sea
# la rama por defecto (main); este workflow queda acotado a workflow_dispatch
# (que tampoco aparece en la UI hasta estar en main). (issue #39 / CI-05)
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA, rama o tag a desplegar
        required: false
        default: develop
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verificar CI antes del redeploy de desarrollo
    if: github.repository == 'Cristhian-S1/ondina-erp'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.resolve-sha.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Resolver SHA a desplegar
        id: resolve-sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Exigir CI verde para el SHA exacto
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ steps.resolve-sha.outputs.sha }}
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            result="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$VERIFIED_SHA&event=push&per_page=100" \
              --jq '[.workflow_runs[] | select(.head_branch == "develop" or .head_branch == "main")] | sort_by(.run_number) | last // empty | [.id, .status, (.conclusion // "pending")] | @tsv')"
            if [ -n "$result" ]; then
              read -r run_id status conclusion <<< "$result"
              if [ "$status" = completed ]; then
                if [ "$conclusion" != success ]; then
                  echo "::error::CI $run_id terminó en $conclusion para $VERIFIED_SHA"
                  exit 1
                fi
                echo "CI verificado: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run_id (SHA $VERIFIED_SHA)" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
            echo "Esperando CI para $VERIFIED_SHA ($attempt/60)"
            sleep 15
          done
          echo "::error::No hay CI verde para $VERIFIED_SHA después de 15 minutos; no se publica"
          exit 1

  deploy:
    name: Deploy Vercel Desarrollo (develop)
    needs: verify
    # Guard de repositorio canónico (REV-5): no ejecutar deploys en forks.
    if: github.repository == 'Cristhian-S1/ondina-erp'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-develop
      cancel-in-progress: false
    environment:
      name: development
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false

      - name: Comprobar SHA desplegado
        env:
          EXPECTED_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "SHA desplegado: $EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node (frontend/.nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Vercel CLI
        run: npm install -g vercel@63.1.2

      - name: Deploy a Vercel (ambiente desarrollo / preview)
        run: vercel --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
