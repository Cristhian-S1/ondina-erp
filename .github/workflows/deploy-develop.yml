name: Deploy Desarrollo

on:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: deploy-dev-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Vercel Desarrollo (develop)
    runs-on: ubuntu-latest
    environment:
      name: development
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy a Vercel (ambiente desarrollo / preview)
        run: vercel --cwd frontend --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}