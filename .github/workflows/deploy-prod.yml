name: Deploy Produccion

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  # Job de verificación previo: corre antes que el deploy y no requiere
  # aprobación, así falla rápido si algo malo llegó a main.
  verify:
    name: Verificar lint + build antes de producción
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: typecheck + build
        run: npm run build

      - name: Unit/Integration tests
        run: npm run test -- --reporter=dot

  # Job de deploy a producción: requiere aprobación manual vía el
  # environment "production" de GitHub Actions. En Settings → Environments
  # → production añadir "Required reviewers" (administradores del repo).
  deploy:
    name: Deploy Vercel Producción (main)
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://ondina-erp.vercel.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy a Vercel (ambiente de producción)
        run: vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}