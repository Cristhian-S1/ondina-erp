name: Deploy Produccion

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA, rama o tag a desplegar (por ejemplo, un rollback)
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  # Job de verificación previo: corre antes que el deploy y no requiere
  # aprobación, así falla rápido si algo malo llegó a main.
  verify:
    name: Verificar lint + build antes de producción
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Node (frontend/.nvmrc)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: typecheck + build
        run: npm run build

      - name: Unit/Integration tests
        run: npm run test -- --reporter=dot

  # Job de deploy a producción: requiere aprobación manual vía el
  # environment "production" de GitHub Actions. En Settings → Environments
  # → production añadir "Required reviewers" (administradores del repo).
  deploy:
    name: Deploy Vercel Producción (main)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://ondina-erp.vercel.app
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Vercel CLI
        run: npm install -g vercel@63.1.2

      - name: Deploy a Vercel (ambiente de producción)
        run: vercel --prod --yes --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
