name: Deploy Produccion

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA, rama o tag a desplegar (por ejemplo, un rollback)
        required: false
        default: main
        type: string

permissions:
  contents: read

jobs:
  # Job de verificación previo: corre antes que el deploy y no requiere
  # aprobación, así falla rápido si algo malo llegó a main.
  verify:
    name: Verificar lint + build antes de producción
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    # REV-6: la ref solicitada se resuelve una sola vez a un SHA completo;
    # el job deploy publica exactamente ese commit.
    outputs:
      sha: ${{ steps.resolve-sha.outputs.sha }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Resolver SHA a desplegar
        id: resolve-sha
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "SHA resuelto: $sha"

      - name: Require exact-SHA quality and Security results
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ steps.resolve-sha.outputs.sha }}
          REQUIRED_WORKFLOWS: ci.yml security.yml
          BRANCH_FILTER: '.head_branch == "main"'
        run: |
          set -euo pipefail
          [[ "$VERIFIED_SHA" =~ ^[0-9a-f]{40}$ ]]
          # The automatic CI publisher uses needs for quality; never wait on itself.
          for attempt in {1..60}; do
            ready=true
            for workflow in $REQUIRED_WORKFLOWS; do
              result="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$VERIFIED_SHA&event=push&per_page=100" \
                --jq "[.workflow_runs[] | select(.head_sha == \"$VERIFIED_SHA\" and .event == \"push\") | select($BRANCH_FILTER)] | sort_by(.run_number) | last // empty | [.id, .status, (.conclusion // \"pending\")] | @tsv")"
              if [ -z "$result" ]; then
                ready=false
                continue
              fi
              read -r run_id status conclusion <<< "$result"
              if [ "$status" != completed ]; then
                ready=false
                continue
              fi
              if [ "$conclusion" != success ]; then
                echo "::error::$workflow run $run_id ended in $conclusion for $VERIFIED_SHA"
                exit 1
              fi
              # Explicit job success rejects skipped/missing jobs; PR dependency review
              # is deliberately excluded because it does not execute on push.
              required_jobs='["Secret scan + self-test"]'
              if [ "$workflow" = ci.yml ]; then
                required_jobs='["Lint + typecheck + build + test", "Validar migraciones Supabase"]'
              fi
              jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=latest&per_page=100" --paginate --slurp)"
              if ! jq -e --arg sha "$VERIFIED_SHA" --argjson required "$required_jobs" '
                [.[].jobs[]] as $jobs |
                all($required[]; . as $name |
                  [$jobs[] | select(.name == $name)] as $matches |
                  ($matches | length) == 1 and
                  all($matches[]; .head_sha == $sha and .status == "completed" and .conclusion == "success"))
              ' <<< "$jobs" > /dev/null; then
                echo "::error::$workflow run $run_id lacks successful required jobs for $VERIFIED_SHA"
                exit 1
              fi
              echo "Verified $workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run_id (SHA $VERIFIED_SHA)" >> "$GITHUB_STEP_SUMMARY"
            done
            if [ "$ready" = true ]; then
              exit 0
            fi
            echo "Waiting for quality/security evidence for $VERIFIED_SHA ($attempt/60)"
            sleep 15
          done
          echo "::error::Missing or pending quality/security evidence after 15 minutes; publication blocked"
          exit 1

      - name: Setup Node (frontend/.nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: typecheck + build
        run: npm run build

      - name: Presupuesto del bundle
        run: npm run size

      - name: Unit/Integration tests
        run: npm run test -- --reporter=dot

  # Job de deploy a producción: requiere aprobación manual vía el
  # environment "production" de GitHub Actions. En Settings → Environments
  # → production añadir "Required reviewers" (administradores del repo).
  deploy:
    name: Deploy Vercel Producción (main)
    needs: verify
    # Guard de repositorio canónico (REV-5): no ejecutar deploys en forks.
    if: github.repository == 'Cristhian-S1/ondina-erp'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    environment:
      name: production
      url: https://ondina-erp.vercel.app
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # REV-6: SHA completo resuelto en verify, nunca una ref mutable.
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false

      - name: Comprobar SHA desplegado
        env:
          EXPECTED_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          sha="$(git rev-parse HEAD)"
          echo "SHA desplegado: $sha"
          if [ "$sha" != "$EXPECTED_SHA" ]; then
            echo "::error::El checkout ($sha) no coincide con el SHA verificado ($EXPECTED_SHA)"
            exit 1
          fi

      - name: Setup Vercel CLI
        run: npm install -g vercel@63.1.2

      - name: Deploy a Vercel (production)
        id: publish
        env:
          EXPECTED_SHA: ${{ needs.verify.outputs.sha }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          set -euo pipefail
          application_sha="$(git rev-parse HEAD)"
          test "$application_sha" = "$EXPECTED_SHA"
          [[ "$application_sha" =~ ^[0-9a-f]{40}$ ]]
          # Override provider/workflow defaults, including on a manual rollback.
          deployment_url="$(vercel --prod --yes --token="$VERCEL_TOKEN" \
            --build-env "VERCEL_GIT_COMMIT_SHA=$application_sha" \
            --build-env "GITHUB_SHA=$application_sha")"
          # Keep only the immutable URL returned on stdout, never CLI diagnostics.
          [[ "$deployment_url" =~ ^https://[a-zA-Z0-9.-]+\.vercel\.app$ ]]
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Record release receipt
        env:
          APPLICATION_SHA: ${{ needs.verify.outputs.sha }}
          APPLICATION_REF: ${{ inputs.ref || github.ref }}
          RELEASE_ENVIRONMENT: production
          DEPLOYMENT_URL: ${{ steps.publish.outputs.deployment_url }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPLICATION_SHA"
          # Vite derives __APP_VERSION__ from the explicitly supplied build SHA.
          build_version="${APPLICATION_SHA:0:7}"
          jq -n \
            --arg application_sha "$APPLICATION_SHA" \
            --arg workflow_sha "$GITHUB_SHA" \
            --arg ref "$APPLICATION_REF" \
            --arg workflow_ref "$GITHUB_REF" \
            --arg environment "$RELEASE_ENVIRONMENT" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg deployment_url "$DEPLOYMENT_URL" \
            --arg published_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg build_commit_sha "$APPLICATION_SHA" \
            --arg build_version "$build_version" \
            '$ARGS.named' > "$RUNNER_TEMP/release-receipt.json"
          {
            echo '### Published application release receipt'
            echo "Application SHA: $APPLICATION_SHA"
            echo "Workflow SHA: $GITHUB_SHA"
            echo '```json'
            cat "$RUNNER_TEMP/release-receipt.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-receipt
          path: ${{ runner.temp }}/release-receipt.json
          if-no-files-found: error
