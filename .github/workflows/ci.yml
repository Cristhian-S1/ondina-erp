name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint + typecheck + build + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node (frontend/.nvmrc)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: typecheck + build
        run: npm run build

      - name: Unit/Integration tests
        run: npm run test -- --reporter=dot

  migrations-check:
    name: Validar migraciones Supabase (sintaxis, no aplica)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validar sintaxis SQL de migraciones
        working-directory: supabase/migrations
        run: |
          set -e
          if ! ls *.sql 1>/dev/null 2>&1; then
            echo "No hay archivos SQL en supabase/migrations/"
            exit 0
          fi
          for f in *.sql; do
            if [ -f "$f" ]; then
              echo "Validando $f"
              if ! grep -q ";" "$f"; then
                echo "::error::$f no contiene sentencias terminadas en ';'"
                exit 1
              fi
            fi
          done
          echo "Sintaxis SQL basica OK"
