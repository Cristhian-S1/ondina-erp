name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint + typecheck + build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: typecheck + build
        run: npm run build

      - name: Unit/Integration tests
        run: npm run test -- --reporter=dot

  migrations-check:
    name: Validar migraciones Supabase (sintaxis, no aplica)
    runs-on: ubuntu-latest
    if: hashFiles('supabase/migrations/*.sql') != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar sintaxis SQL de migraciones
        working-directory: supabase/migrations
        run: |
          set -e
          for f in *.sql; do
            if [ -f "$f" ]; then
              echo "Validando $f"
              if ! grep -q ";" "$f"; then
                echo "::error::$f no contiene sentencias terminadas en ';'"
                exit 1
              fi
            fi
          done
          echo "Sintaxis SQL básica OK"